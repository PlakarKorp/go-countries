name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The kortex coverage upload authenticates with the job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # Run the tests producing both a coverage profile and a JUnit XML.
      # go-junit-report converts `go test -json` output into JUnit, and is
      # installed rather than added to go.mod so the library keeps having no
      # dependencies at all.
      #
      # A test failure must not abort the job, or the upload steps below would
      # be skipped and we would lose the results that explain the failure.
      # continue-on-error plus an explicit exit captures the outcome for the
      # final step to re-surface.
      - name: test
        id: gotest
        continue-on-error: true
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          set -o pipefail
          go test -race -coverprofile=coverage.out -covermode=atomic -timeout 5m -json ./... \
            | "$(go env GOPATH)/bin/go-junit-report" -parser gojson -set-exit-code > junit.xml
          status=$?
          echo "test_exit=$status" >> "$GITHUB_OUTPUT"
          exit $status

      # kortex gets the same reports, sent by the uploader it serves (a public
      # repository cannot use its action) with the job's OIDC token: no secret.
      # A pull request from a fork gets no token and uploads nothing. Failing
      # here is a warning, never a failed build.
      - name: Upload coverage and test results to kortex
        if: ${{ !cancelled() }}
        run: |
          if ! curl -fsSL --retry 3 https://kortex.plakar.io/dl/kortex-linux-amd64 -o "$RUNNER_TEMP/kortex"; then
            echo "::warning title=kortex coverage upload::could not fetch the uploader"
            exit 0
          fi
          chmod +x "$RUNNER_TEMP/kortex"
          "$RUNNER_TEMP/kortex" coverage upload --url https://kortex.plakar.io coverage.out junit.xml

      # Surface a genuine test failure now that the results have been uploaded.
      - name: Fail if tests failed
        if: ${{ steps.gotest.outputs.test_exit != '0' }}
        run: exit 1

      - name: data is reproducible
        run: |
          go run ./internal/gen -o /tmp/countries_data.go
          diff /tmp/countries_data.go countries_data.go
